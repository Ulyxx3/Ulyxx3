name: GitHub Metrics

on:
  # Exécution automatique chaque jour à minuit UTC
  schedule:
    - cron: "0 0 * * *"
  # Permet de lancer manuellement le workflow depuis l'onglet Actions
  workflow_dispatch:
  # Relance la génération lors d'un push sur la branche principale
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          # Personal Access Token (PAT) avec permissions read:org et repo
          token: ${{ secrets.METRICS_TOKEN }}

          user: Ulyxx3
          template: classic
          base: "" # Masque l'en-tête par défaut pour n'afficher que le bloc langages
          config_timezone: Europe/Paris
          filename: github-metrics.svg

          # Masque le titre "23 Languages" en bleu
          extras_css: |
            h2 {
              display: none !important;
            }

          # Inclut vos dépôts personnels + collaborations + organisations (StreamMusicViewer / OSMV)
          repositories_affiliations: owner, collaborator, organization_member

          # Configuration du plugin "Languages activity"
          plugin_languages: yes
          plugin_languages_sections: most-used # Uniquement les langages les plus utilisés
          plugin_languages_details: percentage # Uniquement les pourcentages
          plugin_languages_indepth: yes # Analyse en profondeur pour un calcul précis
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8 # Maximum supporté par le template SVG (top 8 des langages de programmation)
          plugin_languages_other: no # Ne crée pas de catégorie "Other" pour afficher tous les vrais langages
          plugin_languages_threshold: 0%
